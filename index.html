<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Sapra Prompt Creator Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); overscroll-behavior: none; }
        
        #loadingScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader { width: 80px; height: 80px; border: 5px solid rgba(99, 102, 241, 0.1); border-top: 5px solid #6366f1; border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .wave-text { font-size: 2.5rem; font-weight: 900; background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .wave-text span { display: inline-block; animation: wave 1.5s ease-in-out infinite; }
        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .wave-text span:nth-child(1) { animation-delay: 0s; }
        .wave-text span:nth-child(2) { animation-delay: 0.1s; }
        .wave-text span:nth-child(3) { animation-delay: 0.2s; }
        .wave-text span:nth-child(4) { animation-delay: 0.3s; }
        .wave-text span:nth-child(5) { animation-delay: 0.4s; }
        .wave-text span:nth-child(6) { animation-delay: 0.5s; }
        .wave-text span:nth-child(7) { animation-delay: 0.6s; }
        .wave-text span:nth-child(8) { animation-delay: 0.7s; }
        .wave-text span:nth-child(9) { animation-delay: 0.8s; }
        .wave-text span:nth-child(10) { animation-delay: 0.9s; }
        .wave-text span:nth-child(11) { animation-delay: 1s; }
        .wave-text span:nth-child(12) { animation-delay: 1.1s; }
        .wave-text span:nth-child(13) { animation-delay: 1.2s; }
        .wave-text span:nth-child(14) { animation-delay: 1.3s; }
        .wave-text span:nth-child(15) { animation-delay: 1.4s; }
        .wave-text span:nth-child(16) { animation-delay: 1.5s; }
        .wave-text span:nth-child(17) { animation-delay: 1.6s; }
        .wave-text span:nth-child(18) { animation-delay: 1.7s; }
        .wave-text span:nth-child(19) { animation-delay: 1.8s; }
        .wave-text span:nth-child(20) { animation-delay: 1.9s; }
        
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-dark { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .gradient-btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s; }
        .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); }
        .gradient-btn:active { transform: translateY(0); }
        
        body.light-mode { background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); }
        body.light-mode .glass { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.1); }
        body.light-mode .glass-dark { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0, 0, 0, 0.05); }
        body.light-mode .text-white { color: #0f172a !important; }
        body.light-mode .text-gray-400 { color: #64748b !important; }
        body.light-mode .text-gray-300 { color: #475569 !important; }
        
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body class="min-h-screen">
    
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <canvas id="vantaCanvas" style="position: absolute; inset: 0; z-index: 0;"></canvas>
        <div style="position: relative; z-index: 1;" class="text-center">
            <div class="loader mb-8"></div>
            <h2 class="wave-text mb-6" dir="ltr">
                <span>S</span><span>a</span><span>p</span><span>r</span><span>a</span>
                <span> </span>
                <span>P</span><span>r</span><span>o</span><span>m</span><span>p</span><span>t</span>
                <span> </span>
                <span>C</span><span>r</span><span>e</span><span>a</span><span>t</span><span>o</span><span>r</span>
            </h2>
            <div class="flex items-center justify-center gap-2 mb-4">
                <div class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                <div class="w-2 h-2 bg-pink-500 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
            </div>
            <p class="text-gray-400 text-sm">در حال بارگذاری تجربه حرفهای...</p>
        </div>
        <div class="absolute bottom-8 left-0 right-0 text-center" style="z-index: 1;">
            <p class="text-gray-500 text-xs mb-1">توسعه یافته توسط</p>
            <p class="text-indigo-400 text-sm font-bold">Amin Naseri Karimvand</p>
            <p class="text-gray-500 text-xs">akarimvand@gmail.com</p>
        </div>
    </div>
    
    <!-- Progress Bar -->
    <div class="fixed top-0 left-0 right-0 h-1 bg-slate-900/50 z-50">
        <div id="progress" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 transition-all duration-500" style="width: 0%; box-shadow: 0 0 20px rgba(99, 102, 241, 0.8);"></div>
    </div>

    <!-- Header -->
    <div class="sticky top-0 glass z-40 px-4 py-4 shadow-2xl">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <button id="backBtn" class="text-gray-400 hover:text-white p-2 rounded-xl hover:bg-white/10 transition-all" style="display:none">
                <i class="fas fa-arrow-right text-xl"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-wand-magic-sparkles text-white"></i>
                </div>
                <h1 class="text-xl font-black text-white">Sapra Pro</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="themeToggle" class="text-2xl p-2 rounded-xl hover:bg-white/10 transition-all">🌙</button>
                <span id="stepCounter" class="text-sm font-bold text-indigo-400 bg-indigo-500/20 px-3 py-1 rounded-full">1/7</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-md mx-auto px-4 py-8 pb-32">
        <div id="mainContent">
            <div id="pageContainer"></div>
        </div>

        <!-- Result Page -->
        <div id="resultPage" class="hidden">
            <div class="glass-dark rounded-3xl p-8 mb-6 card-hover">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-check text-white text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-white">پرامپت شما آماده است!</h2>
                        <p class="text-gray-400 text-sm">کپی کنید و از آن لذت ببرید</p>
                    </div>
                </div>
                
                <div class="glass rounded-2xl p-4 mb-4">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-gray-300 text-sm font-semibold flex items-center gap-2">
                            <i class="fas fa-file-lines"></i>
                            پرامپت نهایی
                        </span>
                        <button id="copyBtn" class="text-indigo-400 text-sm font-semibold hover:text-indigo-300 transition-all flex items-center gap-2">
                            <i class="fas fa-copy"></i>
                            کپی
                        </button>
                    </div>
                    <textarea id="finalPrompt" readonly class="w-full bg-slate-900/50 text-white p-4 rounded-xl text-sm leading-relaxed border border-slate-700/50 focus:border-indigo-500 outline-none" rows="12"></textarea>
                </div>
                
                <div class="grid grid-cols-1 gap-3">
                    <button id="editBtn" class="glass rounded-xl py-3 px-4 font-bold text-white hover:bg-white/10 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-pen-to-square"></i>
                        ویرایش
                    </button>
                    <button id="shareBtn" class="bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl py-3 px-4 font-bold text-white hover:shadow-lg hover:shadow-green-500/50 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-share-nodes"></i>
                        اشتراک
                    </button>
                    <button id="restartBtn" class="gradient-btn rounded-xl py-3 px-4 font-bold text-white flex items-center justify-center gap-2">
                        <i class="fas fa-rotate-right"></i>
                        شروع مجدد
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 glass-dark p-4 shadow-2xl">
        <div class="max-w-md mx-auto">
            <button id="nextBtn" class="w-full gradient-btn text-white py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-3">
                <span>بعدی</span>
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script>
        VANTA.WAVES({
            el: "#vantaCanvas",
            mouseControls: false,
            touchControls: false,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x1e1b4b,
            shininess: 40.00,
            waveHeight: 20.00,
            waveSpeed: 0.6,
            zoom: 0.75
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
